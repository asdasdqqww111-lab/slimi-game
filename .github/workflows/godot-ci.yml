name: SLIMI Godot 4.7 CI & Android Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "4.7.2-stable"

jobs:
  validate-and-test:
    name: Godot Headless Import & Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Download Godot 4.7.2-stable Linux
        run: |
          mkdir -p /tmp/godot
          curl -fsSL "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" -o /tmp/godot/godot.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/Godot_v${GODOT_RELEASE}_linux.x86_64"
          sudo ln -sf "/tmp/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Import Project Headless
        run: godot --headless --import --path .

      - name: Verify Startup Scene Execution
        run: godot --headless --quit-after 30 --path .

      - name: Run SLIMI Automated QA & UI/UX Redesign Test Suite
        run: godot --headless --path . res://tests/TestRunner.tscn

  render-cinematic-showcase:
    name: Render Multi-Angle Reference Views & Motion Video (OpenGL3)
    needs: validate-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install OpenGL3 Xvfb & FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils ffmpeg

      - name: Download Godot 4.7.2-stable Linux
        run: |
          mkdir -p /tmp/godot
          curl -fsSL "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" -o /tmp/godot/godot.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/Godot_v${GODOT_RELEASE}_linux.x86_64"
          sudo ln -sf "/tmp/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot

      - name: Render 5 Canonical Angles, Quality Presets & 180-Frame Motion Sequence
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p /tmp/slimi_renders/deliverables
          godot --headless --import --path .
          xvfb-run -a -s "-screen 0 1280x960x24" \
            godot --audio-driver Dummy --rendering-driver opengl3 --resolution 1280x960 \
            --path . res://scenes/slime/SlimiReferenceTurntable.tscn -- --capture-media=/tmp/slimi_renders

          ls -lh /tmp/slimi_renders/*.png

          # تجميع شريط الزوايا المرجعية الخمس الثابتة في لوحة مقارنة عالية الدقة
          ffmpeg -y \
            -i /tmp/slimi_renders/slimi_view_front.png \
            -i /tmp/slimi_renders/slimi_view_side.png \
            -i /tmp/slimi_renders/slimi_view_back.png \
            -i /tmp/slimi_renders/slimi_view_three_quarter.png \
            -i /tmp/slimi_renders/slimi_view_close_up.png \
            -filter_complex "[0:v]scale=512:384[v0];[1:v]scale=512:384[v1];[2:v]scale=512:384[v2];[3:v]scale=512:384[v3];[4:v]scale=512:384[v4];[v0][v1][v2][v3][v4]hstack=inputs=5[out]" \
            -map "[out]" /tmp/slimi_renders/deliverables/slimi_5_angle_turnaround.png

          # تجميع لوحة التدرج البصري بين المستويات الثلاثة (LOW / MEDIUM / HIGH)
          ffmpeg -y \
            -i /tmp/slimi_renders/slimi_preset_low.png \
            -i /tmp/slimi_renders/slimi_preset_medium.png \
            -i /tmp/slimi_renders/slimi_preset_high.png \
            -filter_complex "[0:v]scale=640:480[p0];[1:v]scale=640:480[p1];[2:v]scale=640:480[p2];[p0][p1][p2]hstack=inputs=3[pout]" \
            -map "[pout]" /tmp/slimi_renders/deliverables/slimi_quality_presets_comparison.png

          # ترميز فيديو استعراض الحركة السينمائي (6 ثوانٍ، 30fps، H.264 MP4)
          ffmpeg -y -framerate 30 -i /tmp/slimi_renders/frames/frame_%04d.png \
            -c:v libx264 -pix_fmt yuv420p -crf 19 -movflags +faststart \
            /tmp/slimi_renders/deliverables/slimi_cinematic_showcase.mp4

          cp /tmp/slimi_renders/slimi_view_*.png /tmp/slimi_renders/deliverables/
          cp /tmp/slimi_renders/slimi_preset_*.png /tmp/slimi_renders/deliverables/
          cp /tmp/slimi_renders/slimi_touch_dent_closeup.png /tmp/slimi_renders/deliverables/

          # التقاط لقطات الشاشة التسع الفعلية لواجهة وتجربة SLIMI المحدّثة (OpenGL3 720x1280 Portrait)
          mkdir -p /tmp/slimi_renders/ui_screens
          xvfb-run -a -s "-screen 0 720x1280x24" \
            godot --audio-driver Dummy --rendering-driver opengl3 --resolution 720x1280 \
            --path . res://scenes/ui/SlimiUIUXShowcaseCapture.tscn -- --capture-ui=/tmp/slimi_renders/ui_screens

          cp /tmp/slimi_renders/ui_screens/ui_*.png /tmp/slimi_renders/deliverables/

          # تجميع لوحة العرض الشاملة للشاشات التسع (3x3 Portrait Grid)
          ffmpeg -y \
            -i /tmp/slimi_renders/ui_screens/ui_01_splash.png \
            -i /tmp/slimi_renders/ui_screens/ui_02_onboarding.png \
            -i /tmp/slimi_renders/ui_screens/ui_03_home_rtl_light.png \
            -i /tmp/slimi_renders/ui_screens/ui_04_home_dark_mode.png \
            -i /tmp/slimi_renders/ui_screens/ui_05_chat_screen.png \
            -i /tmp/slimi_renders/ui_screens/ui_06_activities_games.png \
            -i /tmp/slimi_renders/ui_screens/ui_07_customize_360.png \
            -i /tmp/slimi_renders/ui_screens/ui_08_settings_6tabs.png \
            -i /tmp/slimi_renders/ui_screens/ui_09_exit_modal.png \
            -filter_complex "[0:v]scale=360:640[u0];[1:v]scale=360:640[u1];[2:v]scale=360:640[u2];[3:v]scale=360:640[u3];[4:v]scale=360:640[u4];[5:v]scale=360:640[u5];[6:v]scale=360:640[u6];[7:v]scale=360:640[u7];[8:v]scale=360:640[u8];[u0][u1][u2][u3][u4][u5][u6][u7][u8]xstack=inputs=9:layout=0_0|w0_0|w0+w1_0|0_h0|w0_h0|w0+w1_h0|0_h0+h3|w0_h0+h3|w0+w1_h0+h3[uout]" \
            -map "[uout]" /tmp/slimi_renders/deliverables/slimi_ui_ux_9_screens_grid.png

          ls -lh /tmp/slimi_renders/deliverables/

      - name: Upload Multi-Angle Renders & Motion Video Artifact
        uses: actions/upload-artifact@v7
        with:
          name: slimi-cinematic-renders-and-video
          path: /tmp/slimi_renders/deliverables/*
          if-no-files-found: error
          retention-days: 30

  export-android-debug:
    name: Export Experimental Android Debug APK
    needs: validate-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK Platform 36 & Build-Tools 36.1.0
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" "platform-tools" "platforms;android-36" "build-tools;36.1.0"

      - name: Install Godot 4.7.2 & Official Export Templates
        run: |
          mkdir -p /tmp/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          curl -fsSL "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" -o /tmp/godot/godot.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/Godot_v${GODOT_RELEASE}_linux.x86_64"
          sudo ln -sf "/tmp/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot

          curl -fsSL "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz" -o /tmp/godot/templates.tpz
          unzip -q /tmp/godot/templates.tpz -d /tmp/godot/templates
          mv /tmp/godot/templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Install Ephemeral Android Gradle Build Template & Debug Keystore
        run: |
          mkdir -p android/build /tmp/keystore ~/.config/godot build/android
          printf '%s\n' "${GODOT_VERSION}.stable" > android/.build_version
          printf '\n' > android/build/.gdignore
          unzip -q ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip -d android/build
          chmod +x android/build/gradlew

          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore /tmp/keystore/debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '[resource]' \
            "export/android/android_sdk_path = \"${ANDROID_HOME}\"" \
            'export/android/debug_keystore = "/tmp/keystore/debug.keystore"' \
            'export/android/debug_keystore_user = "androiddebugkey"' \
            'export/android/debug_keystore_pass = "android"' \
            > ~/.config/godot/editor_settings-4.7.tres

      - name: Export Playable Debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: "/tmp/keystore/debug.keystore"
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: "androiddebugkey"
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: "android"
        run: |
          godot --headless --import --path .
          godot --headless --path . --export-debug "Android" build/android/slimi-debug.apk
          test -s build/android/slimi-debug.apk

      - name: Verify APK Signature, SDK 26+, ABIs, and Offline Manifest
        run: |
          APKSIGNER="${ANDROID_HOME}/build-tools/36.1.0/apksigner"
          AAPT2="${ANDROID_HOME}/build-tools/36.1.0/aapt2"

          "${APKSIGNER}" verify --verbose build/android/slimi-debug.apk > /tmp/apksigner.txt
          cat /tmp/apksigner.txt

          "${AAPT2}" dump badging build/android/slimi-debug.apk > /tmp/badging.txt
          sed -n '1,30p' /tmp/badging.txt

          if ! grep -q "package: name='com.slimigame.slimi'" /tmp/badging.txt; then
            echo "::error title=Package Check::Expected com.slimigame.slimi, got $(head -n 1 /tmp/badging.txt)"
            exit 1
          fi
          if ! grep -Eq "(minSdkVersion|sdkVersion):'26'" /tmp/badging.txt; then
            echo "::error title=MinSDK Check::Expected minSdkVersion 26, got $(grep -i 'sdk' /tmp/badging.txt | tr '\n' ' ' || true)"
            exit 1
          fi
          if ! grep -q "arm64-v8a" /tmp/badging.txt || ! grep -q "armeabi-v7a" /tmp/badging.txt; then
            echo "::error title=ABI Check::Expected arm64-v8a and armeabi-v7a, got $(grep native-code /tmp/badging.txt || true)"
            exit 1
          fi
          if grep -Eq "android.permission.(CAMERA|ACCESS_FINE_LOCATION|READ_CONTACTS|READ_EXTERNAL_STORAGE)" /tmp/badging.txt; then
            echo "::error title=Privacy Check::Unexpected invasive permission found in APK"
            exit 1
          fi

          APK_BYTES=$(stat -c "%s" build/android/slimi-debug.apk)
          APK_MIB=$(awk "BEGIN {printf \"%.2f MiB\", ${APK_BYTES}/1048576}")
          APK_MB=$(awk "BEGIN {printf \"%.2f MB\", ${APK_BYTES}/1000000}")
          APK_SHA256=$(sha256sum build/android/slimi-debug.apk | awk '{print $1}')

          echo "::notice title=SLIMI APK Verified::File=slimi-debug.apk | Size=${APK_MB} (${APK_MIB} / ${APK_BYTES} bytes) | SHA256=${APK_SHA256} | Package=com.slimigame.slimi | MinSDK=26 | ABIs=arm64-v8a,armeabi-v7a | Signature=Verified | DefaultMode=OfflineFirst"
          {
            echo "### SLIMI Experimental Android Debug APK Summary"
            echo "- **File**: \`slimi-debug.apk\`"
            echo "- **Size**: ${APK_MB} (${APK_MIB} / ${APK_BYTES} bytes)"
            echo "- **SHA-256**: \`${APK_SHA256}\`"
            echo "- **Package**: \`com.slimigame.slimi\`"
            echo "- **Min SDK**: 26 (Android 8.0+)"
            echo "- **ABIs**: \`arm64-v8a\`, \`armeabi-v7a\`"
            echo "- **Renderer**: \`gl_compatibility\`"
            echo "- **Quality Default**: \`MEDIUM\` (Scalable \`LOW\` / \`MEDIUM\` / \`HIGH\`)"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: slimi-android-debug-apk
          path: build/android/slimi-debug.apk
          if-no-files-found: error
          retention-days: 30
